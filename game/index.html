<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BONFIRE: WINTER SURVIVORS — Windows 95</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Mock Windows 95 desktop, 1024x768 -->
<div id="desktop">
  <div class="dicon" style="left:14px;top:14px">
    <div class="dimg computer"></div><span>My Computer</span>
  </div>
  <div class="dicon" style="left:14px;top:86px">
    <div class="dimg bin"></div><span>Recycle Bin</span>
  </div>
  <div class="dicon" id="icon-bonfire" style="left:14px;top:158px">
    <div class="dimg fire"></div><span>Bonfire: Winter Survivors</span>
  </div>

  <!-- Game window -->
  <div id="window" class="win">
    <div class="wintitle">
      <span class="wtitle">BONFIRE: WINTER SURVIVORS — C:\BONFIRE\BONFIRE.EXE</span>
      <span class="wbtns"><button title="Minimize">_</button><button title="Maximize">□</button><button title="Close">✕</button></span>
    </div>
    <div class="winmenu"><span><u>F</u>ile</span><span><u>V</u>iew</span><span><u>H</u>elp</span></div>
    <div id="wrap">
      <div id="pane-left" class="pane"></div>
      <div id="left">
        <div id="screen">
          <canvas id="game" width="640" height="480"></canvas>
        </div>
        <div id="hint">click a survivor to select &middot; click a grid cell to send them there &middot; click a beast to strike it</div>
      </div>
      <div id="pane-right" class="pane"></div>
    </div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <button id="startbtn"><span id="flag"></span><b>Start</b></button>
    <div id="taskbtn"><span class="taskicon"></span>Bonfire: Winter Survivors</div>
    <div id="clock">9:41 PM</div>
  </div>

  <div id="overlay"></div>
  <div id="desktop-crt"></div>
</div>

<script src="src/core/env.js"></script>
<script src="src/core/rng.js"></script>
<script src="src/core/data.js"></script>
<script src="src/core/fire.js"></script>
<script src="src/core/clock.js"></script>
<script src="src/core/sim.js"></script>
<script src="src/audio.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
<script src="src/desktop.js"></script>
<script src="src/main.js"></script>
</body>
</html>
